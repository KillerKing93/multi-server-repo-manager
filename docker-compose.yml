version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - server-manager
      - webhook
      - whatsapp-bot
      - ai-tools
      - rag-data-store
      - puter-broker
      - pihps-scraper
      - rag-engine
    restart: always

  server-manager:
    build: ./server-manager
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/app-repo
    environment:
      - REPO_ROOT=/app-repo
    restart: always

  webhook:
    build: ./webhook
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/app-repo
    environment:
      - GITHUB_SECRET=your_github_webhook_secret
    restart: always

  whatsapp-bot:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./services/whatsapp-bot:/app
    command: sh -c "npm install && node src/index.js"
    restart: always

  ai-tools:
    image: php:8.2-fpm-alpine
    volumes:
      - ./services/ai-tools:/var/www/html
    restart: always

  rag-data-store:
    image: php:8.2-fpm-alpine
    volumes:
      - ./services/rag-data-store:/var/www/html
    restart: always

  puter-broker:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./services/puter-broker:/app
    command: sh -c "npm install && npm start"
    restart: always

  pihps-scraper:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./services/pihps-scraper:/app
    command: sh -c "npm install && npm start"
    restart: always

  rag-engine:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./services/rag-engine:/app
    command: sh -c "npm install && npm start"
    restart: always
