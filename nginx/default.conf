server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.html index.php;

    # Server Manager UI & API
    location / {
        proxy_pass http://server-manager:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }



    # Webhook Listener
    location /webhook {
        proxy_pass http://webhook:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
